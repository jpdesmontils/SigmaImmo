<!DOCTYPE html>
<html lang="fr" data-analysis-type="patrimonial">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiche opportunité — Immeuble Perpignan Saint-Martin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f3ee;
  --surface:#ffffff;
  --card:#edeae3;
  --card-hi:#e4e1d8;
  --border:#d0ccc3;
  --border-hi:#a8a49b;
  --ink:#16150f;
  --ink-2:#5a5850;
  --ink-3:#9a9890;
  --go:#145a2e;
  --go-bg:#d6f0df;
  --go-border:#7ec99a;
  --cond:#7a4108;
  --cond-bg:#faefd5;
  --cond-border:#e0a84a;
  --nogo:#831515;
  --nogo-bg:#fce8e8;
  --nogo-border:#d97373;
  --font-d:'Space Grotesk',sans-serif;
  --font-b:'Inter',sans-serif;
  --font-m:'JetBrains Mono',monospace;
}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
#app.loading,#app.error{max-width:960px;margin:48px auto;padding:20px 32px;font-family:var(--font-d);font-size:16px}
#app.error{color:var(--nogo)}

/* ── HEADER ── */
.site-header{background:var(--ink);color:#f5f3ee;padding:18px 32px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.site-logo{font-family:var(--font-d);font-size:14px;font-weight:600;letter-spacing:.02em}
.site-logo span{font-weight:300;opacity:.55}
.site-header-right{display:flex;align-items:center;gap:16px}
.site-back{font-family:var(--font-m);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:rgba(245,243,238,.65);text-decoration:none;padding:4px 10px;border:1px solid rgba(245,243,238,.25);border-radius:3px;background:transparent;cursor:pointer;transition:color .15s,border-color .15s}
.site-back:hover{color:#f5f3ee;border-color:rgba(245,243,238,.5)}
.site-tag{font-family:var(--font-m);font-size:9px;letter-spacing:.14em;text-transform:uppercase;opacity:.45}

/* ── HERO ── */
.hero{background:var(--surface);padding:32px 32px 0;border-bottom:1px solid var(--border)}
.hero-top{display:grid;grid-template-columns:136px 1fr auto;gap:24px;align-items:start;padding-bottom:24px;border-bottom:1px solid var(--border);margin-bottom:0}
.hero-eyebrow{font-family:var(--font-m);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
.hero-title{font-family:var(--font-d);font-size:26px;font-weight:700;color:var(--ink);line-height:1.2;margin-bottom:5px}
.hero-sub{font-size:13px;color:var(--ink-2);line-height:1.5}
.verdict-block{text-align:right;flex-shrink:0}
.verdict-pill{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:2px;font-family:var(--font-m);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:1.5px solid;margin-bottom:8px}
.verdict-pill.go{color:var(--go);border-color:var(--go-border);background:var(--go-bg)}
.verdict-pill.cond{color:var(--cond);border-color:var(--cond-border);background:var(--cond-bg)}
.verdict-pill.nogo{color:var(--nogo);border-color:var(--nogo-border);background:var(--nogo-bg)}
.verdict-dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.score-circle-wrap{display:flex;flex-direction:column;align-items:center;gap:2px;margin-bottom:8px}
.score-circle{position:relative;width:76px;height:76px}
.score-circle svg{transform:rotate(-90deg)}
.score-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-num{font-family:var(--font-m);font-size:22px;font-weight:700;line-height:1}
.score-denom{font-family:var(--font-m);font-size:10px;color:var(--ink-3)}
.hero-date{font-family:var(--font-m);font-size:9px;color:var(--ink-3);letter-spacing:.06em}

/* KPI strip dans le hero */
.hero-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--border);border-top:1px solid var(--border)}
.hkpi{background:var(--card);padding:14px 16px}
.hkpi-l{font-family:var(--font-m);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.hkpi-v{font-family:var(--font-m);font-size:18px;font-weight:700;color:var(--ink);line-height:1;margin-bottom:3px}
.hkpi-v.g{color:var(--go)}.hkpi-v.w{color:var(--cond)}.hkpi-v.r{color:var(--nogo)}
.hkpi-s{font-size:11px;color:var(--ink-3)}

/* ── TABS ── */
.tabs-nav{display:flex;background:var(--surface);border-bottom:1px solid var(--border);padding:0 32px;overflow-x:auto;gap:0;position:sticky;top:0;z-index:10}
.tab-btn{font-family:var(--font-b);font-size:13px;font-weight:500;color:var(--ink-3);padding:13px 18px;border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color .15s,border-color .15s}
.tab-btn:hover{color:var(--ink)}
.tab-btn.active{color:var(--ink);border-bottom-color:var(--ink)}
.tab-content{display:none;padding:28px 32px;max-width:960px;margin:0 auto}
.tab-content.active{display:block}

/* ── SECTION TITLE ── */
.stitle{font-family:var(--font-m);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);padding-bottom:8px;border-bottom:1px solid var(--border);margin-bottom:18px;margin-top:28px}
.stitle:first-child{margin-top:0}

/* ── NARRATIVE ── */
.narrative{background:var(--card);border-left:3px solid var(--cond);padding:14px 18px;font-size:13px;color:var(--ink-2);line-height:1.75;margin-bottom:20px}
.narrative.go{border-left-color:var(--go)}
.narrative.nogo{border-left-color:var(--nogo)}

/* ── ALERTS ── */
.alerts{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.alert{display:flex;gap:12px;align-items:flex-start;padding:10px 14px;border-radius:2px;font-size:12px;line-height:1.6;border:1px solid}
.alert.g{background:var(--go-bg);border-color:var(--go-border);color:var(--go)}
.alert.w{background:var(--cond-bg);border-color:var(--cond-border);color:var(--cond)}
.alert.d{background:var(--nogo-bg);border-color:var(--nogo-border);color:var(--nogo)}
.alert b{font-weight:600}
.ai{flex-shrink:0;margin-top:1px}

/* ── AXES GRID ── */
.axes-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
@media(max-width:680px){.axes-grid{grid-template-columns:1fr 1fr}}
.axe-card{background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:14px 15px;transition:border-color .15s}
.axe-card:hover{border-color:var(--border-hi)}
.axe-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.axe-name{font-family:var(--font-d);font-size:12px;font-weight:500;color:var(--ink)}
.axe-poids{font-family:var(--font-m);font-size:9px;color:var(--ink-3);margin-top:2px}
.axe-score-wrap{text-align:right}
.axe-score{font-family:var(--font-m);font-size:20px;font-weight:700;line-height:1}
.axe-verdict-lbl{font-family:var(--font-m);font-size:9px;letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.score-bar{height:3px;background:var(--card-hi);border-radius:2px;margin-bottom:8px;overflow:hidden}
.score-bar-fill{height:100%;border-radius:2px}
.axe-comment{font-size:11px;color:var(--ink-3);line-height:1.5}
.sh{color:var(--go)}.sh .score-bar-fill{background:var(--go)}
.sm{color:var(--cond)}.sm .score-bar-fill{background:var(--cond)}
.sl{color:var(--nogo)}.sl .score-bar-fill{background:var(--nogo)}

/* ── KPI DETAIL TABLE ── */
.detail-block{background:var(--surface);border:1px solid var(--border);border-radius:3px;overflow:hidden;margin-bottom:10px}
.detail-hdr{display:flex;justify-content:space-between;align-items:center;padding:9px 15px;background:var(--card);border-bottom:1px solid var(--border)}
.detail-hdr-name{font-family:var(--font-d);font-size:12px;font-weight:600;color:var(--ink)}
.detail-hdr-score{font-family:var(--font-m);font-size:11px;font-weight:700;padding:2px 9px;border-radius:2px;border:1px solid}
.detail-hdr-score.sh{color:var(--go);border-color:var(--go-border);background:var(--go-bg)}
.detail-hdr-score.sm{color:var(--cond);border-color:var(--cond-border);background:var(--cond-bg)}
.detail-hdr-score.sl{color:var(--nogo);border-color:var(--nogo-border);background:var(--nogo-bg)}
.krow{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:baseline;padding:8px 15px;border-bottom:1px solid var(--border);font-size:12px}
.krow:last-child{border-bottom:none}
.klbl{color:var(--ink-2)}
.kval{font-family:var(--font-m);font-weight:500;color:var(--ink);white-space:nowrap}
.kval.g{color:var(--go)}.kval.w{color:var(--cond)}.kval.r{color:var(--nogo)}
.ksrc{font-family:var(--font-m);font-size:10px;color:var(--ink-3);white-space:nowrap}
.kcomment{grid-column:1/-1;font-size:11px;color:var(--ink-3);padding-bottom:3px;line-height:1.5}

/* ── NÉGOCIATION ── */
.price-position{background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:22px 24px;margin-bottom:24px}
.price-position-title,.price-card-label{font-family:var(--font-m);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.price-scale{position:relative;height:170px;margin-top:12px}
.price-scale-line{position:absolute;left:0;right:0;top:82px;height:2px;background:var(--border)}
.price-scale-range{position:absolute;height:20px;top:72px;border:1px solid var(--go);border-radius:2px;background:#dce8e5}
.price-scale-range.offer{top:76px;height:12px;border:none;background:#2d695d}
.price-scale-label,.price-scale-marker{position:absolute;text-align:center;white-space:nowrap;font-family:var(--font-m);font-size:11px}.price-scale-marker{transform:translateX(-50%)}
.price-scale-label.prudent{top:0}.price-scale-label.offer{top:112px}
.price-scale-marker{top:30px;height:78px;border-left:2px solid var(--nogo);color:var(--nogo);padding-left:8px;text-align:left}
.price-scale-marker.total{top:82px;border-left-color:var(--ink-2);color:var(--ink);padding-top:52px}
.price-scale-caption{color:var(--ink-2);font-size:10px;font-weight:400}
.price-position-comment{border-top:1px solid var(--border);padding-top:14px;color:var(--ink-2);line-height:1.7}
.price-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.price-kpi{background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:18px 16px;min-height:132px}
.price-kpi-value{font-family:var(--font-m);font-size:25px;font-weight:700;margin:14px 0 8px}.price-kpi-value.alert-value{color:var(--nogo)}
.price-kpi-note{color:var(--ink-2);line-height:1.6}
.market-table{width:100%;border-collapse:collapse;margin-bottom:10px}.market-table th{padding:8px 10px;border-bottom:1px solid var(--ink);text-align:left;font-family:var(--font-m);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.market-table td{padding:10px;border-bottom:1px solid var(--border);vertical-align:top}.market-table tr.analyzed td{background:var(--nogo-bg);font-weight:600}.market-detail{display:block;margin-top:3px;color:var(--ink-3);font-size:10px;font-weight:400}
.market-limits{color:var(--ink-3);font-size:11px;line-height:1.6;margin-bottom:24px}.data-unavailable{margin-bottom:20px;padding:14px 18px;border:1px dashed var(--border-hi);background:var(--card);color:var(--ink-2)}
@media(max-width:680px){.price-position{padding:16px}.price-scale{height:auto;display:grid;gap:8px;margin-top:16px}.price-scale-line,.price-scale-range{display:none}.price-scale-label,.price-scale-marker{position:static;transform:none;text-align:left!important;border-left:3px solid var(--go);padding:8px 10px!important;height:auto!important}.price-scale-marker{border-left-color:var(--nogo)}.price-scale-marker.total{border-left-color:var(--ink-2)}.price-kpis{grid-template-columns:1fr}.market-table{display:block;overflow-x:auto}}

/* ── SCÉNARIOS ── */
.scenarios{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
@media(max-width:580px){.scenarios{grid-template-columns:1fr}}
.scen-card{background:var(--surface);border:1px solid var(--border);border-radius:3px;overflow:hidden}
.scen-hdr{padding:10px 14px;background:var(--card);border-bottom:1px solid var(--border);font-family:var(--font-d);font-size:13px;font-weight:600;color:var(--ink)}
.scen-row{display:flex;justify-content:space-between;align-items:baseline;padding:7px 14px;border-bottom:1px solid var(--border);font-size:12px}
.scen-row:last-of-type{border-bottom:none}
.scen-lbl{color:var(--ink-3)}
.scen-val{font-family:var(--font-m);font-weight:500;color:var(--ink)}
.scen-foot{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--card-hi);border-top:1px solid var(--border-hi)}
.scen-cf-lbl{font-family:var(--font-m);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.scen-cf-val{font-family:var(--font-m);font-size:17px;font-weight:700}
.hypo{font-size:11px;color:var(--ink-3);line-height:1.65;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:3px;margin-bottom:20px}
.hypo span{color:var(--ink-2)}
.finance-inputs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
.finance-input{display:flex;flex-direction:column;gap:6px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:3px;color:var(--ink-3);font-size:11px}
.finance-input input{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:2px;background:var(--bg);color:var(--ink);font-family:var(--font-m);font-size:14px;text-align:right}
.finance-input input:focus{outline:2px solid var(--cond-border);outline-offset:1px}
@media(max-width:580px){.finance-inputs{grid-template-columns:1fr}}

/* ── REVENUS TABLE ── */
.rev-table{width:100%;border-collapse:collapse;border:1px solid var(--border);border-radius:3px;overflow:hidden;margin-bottom:12px}
.rev-table th{font-family:var(--font-m);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:8px 12px;background:var(--card-hi);border-bottom:1px solid var(--border);border-right:1px solid var(--border);text-align:left}
.rev-table th:last-child{border-right:none}
.rev-table td{padding:8px 12px;font-size:12px;color:var(--ink-2);border-bottom:1px solid var(--border);border-right:1px solid var(--border);vertical-align:top}
.rev-table td:last-child{border-right:none}
.rev-table tr:last-child td{border-bottom:none}
.rev-table tr:hover td{background:var(--card)}
.rev-table .total td{background:var(--card-hi);font-weight:600;border-top:1px solid var(--border-hi)}
.lot-badge{display:inline-block;padding:1px 7px;border-radius:2px;font-family:var(--font-m);font-size:9px;border:1px solid;margin-right:4px}
.lb-comm{color:var(--cond);border-color:var(--cond-border)}
.lb-resi{color:var(--go);border-color:var(--go-border)}
.mono{font-family:var(--font-m);color:var(--ink)}
.tg{color:var(--go)!important;font-weight:500}.tw{color:var(--cond)!important}.tr{color:var(--nogo)!important}

/* ── RISQUES ── */
.risques{border:1px solid var(--border);border-radius:3px;overflow:hidden;margin-bottom:12px}
.risq-hdr{display:grid;grid-template-columns:88px 1fr 1fr auto;background:var(--card-hi);border-bottom:1px solid var(--border)}
.rhc{padding:8px 12px;font-family:var(--font-m);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);border-right:1px solid var(--border)}
.rhc:last-child{border-right:none;text-align:right}
.risq-row{display:grid;grid-template-columns:88px 1fr 1fr auto;background:var(--surface);border-bottom:1px solid var(--border)}
.risq-row:last-child{border-bottom:none}
.risq-row:hover{background:var(--card)}
.rcrit{padding:12px;display:flex;align-items:flex-start;justify-content:center;border-right:1px solid var(--border)}
.rbadge{font-family:var(--font-m);font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border:1px solid;border-radius:2px;white-space:nowrap}
.rbadge.rc{color:var(--nogo);border-color:var(--nogo-border);background:var(--nogo-bg)}
.rbadge.re{color:var(--cond);border-color:var(--cond-border);background:var(--cond-bg)}
.rbadge.rm{color:var(--ink-3);border-color:var(--border)}
.rbody{padding:10px 12px;border-right:1px solid var(--border)}
.rtitle{font-size:12px;font-weight:500;color:var(--ink);margin-bottom:2px}
.rimpact{font-family:var(--font-m);font-size:10px}
.raction{padding:10px 12px;font-size:11px;color:var(--ink-2);line-height:1.5;border-right:1px solid var(--border)}
.rmarge{padding:10px 12px;font-family:var(--font-m);font-size:12px;font-weight:700;text-align:right;white-space:nowrap}

/* ── UPSIDES ── */
.upside-card{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start;background:var(--surface);border:1px solid var(--go-border);border-radius:3px;padding:12px 15px;margin-bottom:8px}
.upside-title{font-size:12px;font-weight:500;color:var(--ink);margin-bottom:3px}
.upside-desc{font-size:11px;color:var(--ink-3);line-height:1.5}
.upside-val-lbl{font-family:var(--font-m);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px;text-align:right}
.upside-val-num{font-family:var(--font-m);font-size:14px;font-weight:700;color:var(--go);text-align:right}
.upside-meta{font-family:var(--font-m);font-size:9px;color:var(--ink-3);margin-top:2px;text-align:right}

/* ── CONTRÔLES ── */
.conditions{border:1px solid var(--border);border-radius:3px;overflow:hidden;margin-bottom:12px}
.cond-item{display:flex;gap:10px;align-items:flex-start;padding:9px 14px;border-bottom:1px solid var(--border);font-size:12px;color:var(--ink-2)}
.cond-item:last-child{border-bottom:none}
.cond-num{font-family:var(--font-m);font-size:10px;color:var(--cond);font-weight:700;min-width:20px;padding-top:1px}

/* ── ANNONCE SOURCE ── */
.source-annonce{margin:20px 32px 0;padding:20px;background:var(--surface);border:1px solid var(--border);border-radius:4px}
.source-annonce h2{font-family:var(--font-d);font-size:18px;margin-bottom:5px}.source-annonce p{color:var(--ink-2);line-height:1.65}.source-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-top:14px}.source-gallery img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:3px;background:var(--card)}.source-meta{font:10px var(--font-m);color:var(--ink-3);margin-top:8px}
/* ── SOURCES ── */
.sources-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin-bottom:20px}
.src-item{font-size:11px;color:var(--ink-3);line-height:1.5}
.src-item::before{content:"→ ";color:var(--border-hi)}

/* ── SCORE RADAR ── */
.radar-wrap{display:flex;justify-content:center;margin-bottom:20px}

/* ── FOOTER ── */
.site-footer{margin-top:40px;border-top:1px solid var(--border);padding:16px 32px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;font-family:var(--font-m);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}

/* ── PHOTOS DU BIEN ── */
.property-gallery{width:136px}.property-main-image{display:block;width:136px;height:102px;object-fit:cover;border:1px solid var(--border);border-radius:3px;background:var(--card)}.property-thumbs{display:flex;gap:4px;overflow-x:auto;margin-top:6px;padding-bottom:2px}.property-thumb{flex:0 0 28px;width:28px;height:22px;border:1px solid var(--border);border-radius:2px;background:center/cover no-repeat;cursor:pointer;padding:0}.property-thumb.active{border:2px solid var(--cond)}
/* ── RECALCUL ── */
.recalculate-button{position:fixed;right:24px;bottom:24px;z-index:20;width:48px;height:48px;border:1px solid var(--cond-border);border-radius:50%;background:var(--cond-bg);color:var(--cond);font-size:21px;cursor:pointer;box-shadow:0 4px 14px rgba(22,21,15,.18);transition:transform .15s,background .15s,color .15s}
.recalculate-button:hover:not(:disabled){background:var(--cond);color:#fff;transform:translateY(-2px)}
.recalculate-button:disabled{cursor:wait;opacity:.7}.recalculate-modal{position:fixed;z-index:30;inset:0;display:grid;place-items:center;padding:20px;background:rgba(22,21,15,.42)}.recalculate-modal-box{width:min(440px,100%);padding:24px;background:var(--surface);border:1px solid var(--border-hi);border-radius:4px;box-shadow:0 16px 42px rgba(22,21,15,.25)}.recalculate-modal-box h2{font-family:var(--font-d);font-size:20px;margin-bottom:8px}.recalculate-modal-box p{color:var(--ink-2)}.recalculate-actions{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;margin-top:20px}.recalculate-actions button{border:1px solid var(--border-hi);border-radius:3px;padding:9px 12px;background:var(--surface);font:500 12px var(--font-b);cursor:pointer}.recalculate-actions button[data-type]{background:var(--ink);border-color:var(--ink);color:#fff}

@media(max-width:680px){
  .hero{padding:20px 16px 0}
  .hero-top{grid-template-columns:1fr}.property-gallery{width:100%;display:flex;gap:8px}.property-main-image{width:132px;height:99px}.property-thumbs{align-self:center;max-width:calc(100% - 140px);margin-top:0}
  .tabs-nav{padding:0 16px}
  .tab-content{padding:20px 16px}
  .risq-hdr,.risq-row{grid-template-columns:1fr}
  .recalculate-button{right:16px;bottom:16px}
}
</style>
</head>
<body>
<main id="app" class="loading">Chargement de l’analyse…</main>

<script id="fiche-template" type="x-template">
<header class="site-header"><div class="site-logo">Patrimonial optimisé <span>· Fiche d’investissement</span></div><div class="site-header-right"><button class="site-back" type="button" data-in-app-return>← Retour</button><a class="site-back" data-source-link href="../index.html" target="_blank">Voir l’annonce</a><div class="site-tag">Prompt v{{promptVersion}} · Schema v{{schemaVersion}}</div></div></header>
<div class="hero"><div class="hero-top"><div class="property-gallery" data-property-gallery><img class="property-main-image" data-gallery-main alt=""><div class="property-thumbs" data-gallery-thumbs></div></div><div><div class="hero-eyebrow">{{source}} · Réf. {{reference}} · {{city}} ({{postalCode}}) · {{analysisDate}}</div><h1 class="hero-title">{{propertyType}} · {{surface}} m²<br>{{city}}</h1><div class="hero-sub">Terrain {{landSurface}} m² · DPE {{dpe}} · Stratégie {{scenarioName}}</div></div><div class="verdict-block"><div class="score-circle"><svg width="76" height="76" viewBox="0 0 76 76"><circle cx="38" cy="38" r="32" fill="none" stroke="#e4e1d8" stroke-width="5"/><circle cx="38" cy="38" r="32" fill="none" stroke="{{decisionColor}}" stroke-width="5" stroke-dasharray="201.1" stroke-dashoffset="{{scoreOffset}}" stroke-linecap="round"/></svg><div class="score-inner"><span class="score-num" style="color:{{decisionColor}}">{{score}}</span><span class="score-denom">/100</span></div></div><span class="verdict-pill {{decisionClass}}"><span class="verdict-dot"></span>{{decision}}</span></div></div><div class="hero-kpis"><div class="hkpi"><div class="hkpi-l">Prix affiché</div><div class="hkpi-v">{{askingPrice}}</div></div><div class="hkpi"><div class="hkpi-l">Coût total</div><div class="hkpi-v w" data-finance-total>{{totalCost}}</div></div><div class="hkpi"><div class="hkpi-l">Apport recommandé</div><div class="hkpi-v">{{contribution}}</div></div><div class="hkpi"><div class="hkpi-l">Paris → bien</div><div class="hkpi-v g">{{totalMinimum}}</div><div class="hkpi-s">minimum porte-à-porte</div></div><div class="hkpi"><div class="hkpi-l">Coût net optimisé</div><div class="hkpi-v g">{{netCost}}</div></div></div></div>
<nav class="tabs-nav" role="tablist"><button class="tab-btn active" data-tab="exec">Synthèse</button><button class="tab-btn" data-tab="train">Paris → destination</button><button class="tab-btn" data-tab="quality">Patrimoine</button><button class="tab-btn" data-tab="levers">Optimisations</button><button class="tab-btn" data-tab="finance">Financement</button><button class="tab-btn" data-tab="risks">Risques</button><button class="tab-btn" data-tab="sources">Sources</button></nav>
<section class="tab-content active" id="exec"><div class="stitle">Résumé de l’analyse</div><div class="narrative {{decisionClass}}">{{summary}}</div>{{#negotiationAvailable}}<div class="stitle">Position du prix demandé sur l’échelle de valeur — en euros</div><div class="price-position"><div class="price-position-title">Valeur, offre et coût total du projet</div>{{#scaleAvailable}}<div class="price-scale"><div class="price-scale-line"></div><div class="price-scale-range" style="{{prudentStyle}}"></div><div class="price-scale-range offer" style="{{offerStyle}}"></div><div class="price-scale-label prudent" style="{{prudentStyle}}"><strong>{{prudentRange}}</strong><div class="price-scale-caption">Valeur prudente estimée {{#prudentEstimate}}· hypothèse{{/prudentEstimate}}</div></div><div class="price-scale-label offer" style="{{offerStyle}}"><strong>{{offerRange}}</strong><div class="price-scale-caption">Fourchette d’offre recommandée</div></div><div class="price-scale-marker" style="{{askingStyle}}"><strong>{{askingPriceNegotiation}}</strong><div class="price-scale-caption">Prix demandé</div></div><div class="price-scale-marker total" style="{{totalStyle}}"><strong>{{totalCostNegotiation}}</strong><div class="price-scale-caption">Coût total frais et provision inclus</div></div></div>{{/scaleAvailable}}{{^scaleAvailable}}<div class="price-kpis"><div class="price-kpi"><div class="price-card-label">Valeur prudente</div><div class="price-kpi-value">{{prudentRange}}</div></div><div class="price-kpi"><div class="price-card-label">Offre recommandée</div><div class="price-kpi-value">{{offerRange}}</div></div><div class="price-kpi"><div class="price-card-label">Prix demandé</div><div class="price-kpi-value">{{askingPriceNegotiation}}</div></div><div class="price-kpi"><div class="price-card-label">Coût total</div><div class="price-kpi-value">{{totalCostNegotiation}}</div></div></div>{{/scaleAvailable}}<div class="price-position-comment">{{negotiationArgument}}</div></div><div class="stitle">Cohérence du prix</div><div class="price-kpis"><div class="price-kpi"><div class="price-card-label">Prix demandé au m²</div><div class="price-kpi-value">{{askingPricePerSqm}}</div><div class="price-kpi-note">Prix demandé pour {{surfaceReference}}</div></div><div class="price-kpi"><div class="price-card-label">Écart vs maisons de la commune</div><div class="price-kpi-value alert-value">{{communeGap}}</div><div class="price-kpi-note">Référence {{communeReference}}</div></div><div class="price-kpi"><div class="price-card-label">Écart vs maisons du quartier</div><div class="price-kpi-value alert-value">{{neighborhoodGap}}</div><div class="price-kpi-note">Référence {{neighborhoodReference}}</div></div></div><table class="market-table"><thead><tr><th>Source</th><th>Type</th><th>€/m²</th><th>Fourchette</th><th>Date</th></tr></thead><tbody>{{#marketRows}}<tr class="{{#analyzed}}analyzed{{/analyzed}}"><td>{{source}}</td><td>{{propertyType}}</td><td>{{pricePerSqm}}</td><td>{{range}}{{#precision}}<span class="market-detail">{{precision}}</span>{{/precision}}</td><td>{{referenceDate}}</td></tr>{{/marketRows}}</tbody></table><div class="market-limits">{{marketLimits}}</div>{{/negotiationAvailable}}{{^negotiationAvailable}}<div class="stitle">Négociation et cohérence du prix</div><div class="data-unavailable">Données indisponibles pour cette analyse. Relancez l’analyse patrimoniale pour générer l’échelle de valeur et les références de marché.</div>{{/negotiationAvailable}}<div class="stitle">Conditions de la décision</div><div class="conditions">{{#conditions}}<div class="cond-item"><span class="cond-num">{{number}}</span><span>{{text}}</span></div>{{/conditions}}{{^conditions}}<div class="cond-item">Aucune condition renseignée.</div>{{/conditions}}</div><div class="stitle">Points clés</div><div class="axes-grid"><div class="axe-card"><div class="upside-title">Point fort</div><div class="upside-desc">{{strength}}</div></div><div class="axe-card"><div class="upside-title">Point de vigilance</div><div class="upside-desc">{{watchout}}</div></div></div></section>
<section class="tab-content" id="train"><div class="stitle">Itinéraire ferroviaire recommandé</div><div class="narrative go"><strong>{{departureStation}} → {{arrivalStation}}</strong> · {{trainTypes}} · {{directLabel}}<br>Train : {{trainMinimum}} minimum, {{trainTypical}} typique · Porte-à-porte : {{totalMinimum}} minimum, {{totalTypical}} typique · Robustesse {{robustness}}</div><div class="hypo">Période observée : {{observationPeriod}} · Jours : {{observedDays}} · Fiabilité : {{reliability}}</div><div class="axes-grid"><div class="axe-card"><div class="axe-name">Jour ouvré</div><div class="axe-score">{{weekdayFrequency}}</div><div class="axe-comment">liaisons exploitables</div></div><div class="axe-card"><div class="axe-name">Samedi</div><div class="axe-score">{{saturdayFrequency}}</div><div class="axe-comment">liaisons exploitables</div></div><div class="axe-card"><div class="axe-name">Dimanche</div><div class="axe-score">{{sundayFrequency}}</div><div class="axe-comment">liaisons exploitables</div></div><div class="axe-card"><div class="axe-name">Accessibilité</div><div class="axe-score">{{accessScore}}/100</div><div class="axe-comment">{{accessVerdict}}</div></div></div><div class="stitle">Commentaire du trajet</div><div class="narrative">{{travelComment}}</div><p>{{frequencyComment}}</p><div class="axes-grid"><div class="axe-card"><div class="upside-title">Point fort</div><div class="upside-desc">{{accessStrength}}</div></div><div class="axe-card"><div class="upside-title">Point de vigilance</div><div class="upside-desc">{{accessWatchout}}</div></div></div><div class="stitle">Détail du score</div><div class="axes-grid">{{#criteria}}<div class="axe-card"><div class="axe-name">{{name}}</div><div class="axe-score">{{score}}</div><div class="axe-comment">{{justification}}</div></div>{{/criteria}}</div><div class="stitle">Dernier kilomètre</div><div class="hypo"><span>{{lastMileMode}}</span> · {{lastMileDistance}} · {{lastMileDuration}} · Voiture indispensable : {{carRequired}}</div><p>{{publicTransport}}</p><div class="stitle">Usages week-end</div><p><strong>Vendredi soir :</strong> {{fridayComment}}</p><p><strong>Dimanche soir retour :</strong> {{sundayComment}}</p><p><strong>Aller-retour journée :</strong> {{roundTrip}} · Temps sur place : {{onSiteTime}} — {{roundTripComment}}</p><div class="stitle">Alternatives</div>{{#alternatives}}<div class="upside-card"><div><div class="upside-title">{{station}} · {{directLabel}}</div><div class="upside-desc">{{comment}}</div></div><div class="upside-val-num">{{duration}}</div></div>{{/alternatives}}{{^alternatives}}<p>Aucun itinéraire alternatif pertinent.</p>{{/alternatives}}</section>
<section class="tab-content" id="quality"><div class="stitle">Stratégie patrimoniale</div><div class="narrative"><strong>Levier retenu : {{retainedLever}}</strong> · Usage : {{heritageUse}}<br>{{retainedLeverJustification}}</div><p>{{heritageComment}}</p><div class="stitle">Qualité patrimoniale</div><div class="axes-grid">{{#quality}}<div class="axe-card"><div class="axe-name">{{label}}</div><div class="axe-comment">{{value}}</div></div>{{/quality}}</div><div class="stitle">Grille de notation pondérée — {{score}}/100</div>{{#scoringAxes}}<div class="detail-block"><div class="detail-hdr"><div class="detail-hdr-name">{{name}} · Poids {{weight}} %</div><div class="detail-hdr-score {{scoreClass}}">{{score}}/100 · {{contribution}} pts</div></div><div class="krow"><span class="klbl">Confiance</span><span class="kval">{{confidence}}</span><span class="kcomment">{{justification}}</span></div><ul class="list">{{#arguments}}<li>{{.}}</li>{{/arguments}}</ul></div>{{/scoringAxes}}</section>
<section class="tab-content" id="levers"><div class="stitle">Leviers d’optimisation étudiés</div>{{#levers}}<div class="detail-block"><div class="detail-hdr"><div class="detail-hdr-name">{{name}}</div><div>{{applicable}} · {{feasibility}}</div></div><div class="krow"><span class="klbl">Résultat central</span><span class="kval">{{central}}</span><span class="ksrc">Dégradé : {{degraded}}</span><span class="kcomment">Travaux : {{works}} · Délai : {{delay}} · {{conditions}}</span></div>{{#sources}}<div class="market-detail">Source : {{#url}}<a href="{{url}}" target="_blank" rel="noopener noreferrer">{{label}}</a>{{/url}}{{^url}}{{label}}{{/url}} · {{date}}</div>{{/sources}}</div>{{/levers}}</section>
<section class="tab-content" id="finance"><div class="stitle">Ventilation du coût d’acquisition</div><div class="price-kpis"><div class="price-kpi"><div class="price-card-label">Prix affiché</div><div class="price-kpi-value">{{askingPrice}}</div></div><div class="price-kpi"><div class="price-card-label">Travaux immédiats</div><div class="price-kpi-value">{{immediateWorks}}</div></div><div class="price-kpi"><div class="price-card-label">Travaux patrimoniaux</div><div class="price-kpi-value">{{heritageWorks}}</div></div><div class="price-kpi"><div class="price-card-label">Frais annexes</div><div class="price-kpi-value">{{annexFees}}</div></div></div><div class="stitle">Coût d’acquisition modifiable</div><div class="finance-inputs" data-finance-editor data-price="{{askingPriceRaw}}" data-annex="{{annexFeesRaw}}"><label class="finance-input">Frais de notaire (€)<input type="number" min="0" step="100" value="{{notaryFeesRaw}}" data-finance-input="notary"></label><label class="finance-input">Travaux totaux (€)<input type="number" min="0" step="100" value="{{worksRaw}}" data-finance-input="works"></label><div class="finance-input"><span>Coût total recalculé</span><strong data-finance-total>{{totalCost}}</strong></div></div><p class="hypo">{{financeJustification}}</p><div class="stitle">Scénarios financiers</div><div class="scenarios">{{#scenarios}}<div class="scen-card"><div class="scen-hdr">{{name}} · Applicable : {{applicable}}</div><div class="scen-row"><span>Apport</span><strong>{{deposit}}</strong></div><div class="scen-row"><span>Capital emprunté</span><strong>{{loan}}</strong></div><div class="scen-row"><span>Taux · durée</span><strong>{{rate}} · {{term}}</strong></div><div class="scen-row"><span>Mensualité</span><strong>{{payment}}</strong></div><div class="scen-row"><span>Revenus d’optimisation/an</span><strong>{{optimizationIncome}}</strong></div><div class="scen-row"><span>Produit de revente net</span><strong>{{resale}}</strong></div><div class="scen-row"><span>Effort mensuel</span><strong>{{effort}}</strong></div><div class="scen-row"><span>Rendement net sur capital</span><strong>{{returnOnCapital}}</strong></div><div class="scen-row"><span>Condition d’activation</span><strong>{{activationCondition}}</strong></div><div class="scen-foot"><span>Coût net optimisé</span><strong>{{netCost}}</strong></div></div>{{/scenarios}}</div></section>
<section class="tab-content" id="risks"><div class="stitle">Risques classés par criticité</div><div class="risques"><div class="risq-hdr"><div class="rhc">Criticité</div><div class="rhc">Risque</div><div class="rhc">Action requise</div><div class="rhc">Impact</div></div>{{#risks}}<div class="risq-row"><div class="rcrit"><span class="rbadge {{criticalityClass}}">{{criticality}}</span></div><div class="rbody"><div class="rtitle">{{titre}}</div></div><div class="raction">{{action}}</div><div class="rmarge {{impactClass}}">{{impact}}</div></div>{{/risks}}</div><div class="stitle">Avant offre</div><ul class="list">{{#beforeOffer}}<li>{{.}}</li>{{/beforeOffer}}</ul><div class="stitle">Avant compromis</div><ul class="list">{{#beforeContract}}<li>{{.}}</li>{{/beforeContract}}</ul></section>
<section class="tab-content" id="sources"><div class="stitle">Sources générales</div><div class="sources-grid">{{#sources}}<div class="src-item">{{#url}}<a href="{{url}}" target="_blank" rel="noopener noreferrer">{{label}}</a>{{/url}}{{^url}}{{label}}{{/url}} · {{date}}</div>{{/sources}}</div><div class="stitle">Sources accessibilité</div><div class="sources-grid">{{#accessSources}}<div class="src-item">{{#url}}<a href="{{url}}" target="_blank" rel="noopener noreferrer">{{label}}</a>{{/url}}{{^url}}{{label}}{{/url}} · {{date}}</div>{{/accessSources}}</div><div class="stitle">Avertissements généraux</div><ul class="list">{{#warnings}}<li>{{.}}</li>{{/warnings}}{{^warnings}}<li>Aucun avertissement.</li>{{/warnings}}</ul><div class="stitle">Avertissements accessibilité</div><ul class="list">{{#accessWarnings}}<li>{{.}}</li>{{/accessWarnings}}{{^accessWarnings}}<li>Aucun avertissement.</li>{{/accessWarnings}}</ul><p class="hypo">Analyse indicative, avant fiscalité personnelle. Les horaires ferroviaires sont susceptibles d’évoluer.</p></section>
<footer class="site-footer"><span>Patrimonial optimisé · Prompt v{{promptVersion}}</span><span>{{city}} · {{analysisDate}}</span><span>{{decision}} · {{score}}/100</span></footer>
</script>
<script src="js/fiche.js" data-analysis-type="patrimonial"></script>
</body>
</html>
