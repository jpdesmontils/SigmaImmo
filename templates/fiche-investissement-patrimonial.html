<!DOCTYPE html>
<html lang="fr" data-ui="fiche-patrimonial" data-analysis-type="patrimonial">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiche opportunité — Immeuble Perpignan Saint-Martin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/design-system.css">
  <link rel="stylesheet" href="../assets/css/fiches.css">
</head>
<body>
<main id="app" class="loading">Chargement de l’analyse…</main>

<script id="fiche-template" type="x-template">
<header class="site-header"><div class="site-logo">Patrimonial optimisé <span>· Fiche d’investissement</span></div><div class="site-header-right"><button class="site-back" type="button" data-in-app-return>← Retour</button><a class="site-back" data-source-link href="../index.html" target="_blank">Voir l’annonce</a><div class="site-tag">Prompt v{{promptVersion}} · Schema v{{schemaVersion}}</div></div></header>
<div class="hero"><div class="hero-top"><div class="property-gallery" data-property-gallery><img class="property-main-image" data-gallery-main alt=""><div class="property-thumbs" data-gallery-thumbs></div></div><div><div class="hero-eyebrow">{{source}} · Réf. {{reference}} · {{city}} ({{postalCode}}) · {{analysisDate}}</div><h1 class="hero-title">{{propertyType}} · {{surface}} m²<br>{{city}}</h1><div class="hero-sub">Terrain {{landSurface}} m² · DPE {{dpe}} · Stratégie {{scenarioName}}</div></div><div class="verdict-block"><div class="score-circle"><svg width="76" height="76" viewBox="0 0 76 76"><circle cx="38" cy="38" r="32" fill="none" stroke="#e4e1d8" stroke-width="5"/><circle cx="38" cy="38" r="32" fill="none" stroke="{{decisionColor}}" stroke-width="5" stroke-dasharray="201.1" stroke-dashoffset="{{scoreOffset}}" stroke-linecap="round"/></svg><div class="score-inner"><span class="score-num" style="color:{{decisionColor}}">{{score}}</span><span class="score-denom">/100</span></div></div><span class="verdict-pill {{decisionClass}}"><span class="verdict-dot"></span>{{decision}}</span></div></div><div class="hero-kpis"><div class="hkpi"><div class="hkpi-l">Prix affiché</div><div class="hkpi-v">{{askingPrice}}</div></div><div class="hkpi"><div class="hkpi-l">Coût total</div><div class="hkpi-v w" data-finance-total>{{totalCost}}</div></div><div class="hkpi"><div class="hkpi-l">Apport recommandé</div><div class="hkpi-v">{{contribution}}</div></div><div class="hkpi"><div class="hkpi-l">Paris → bien</div><div class="hkpi-v g">{{totalMinimum}}</div><div class="hkpi-s">minimum porte-à-porte</div></div><div class="hkpi"><div class="hkpi-l">Coût net optimisé</div><div class="hkpi-v g">{{netCost}}</div></div></div></div>
<nav class="tabs-nav" role="tablist"><button class="tab-btn active" data-tab="exec">Synthèse</button><button class="tab-btn" data-tab="train">Paris → destination</button><button class="tab-btn" data-tab="quality">Patrimoine</button><button class="tab-btn" data-tab="levers">Optimisations</button><button class="tab-btn" data-tab="finance">Financement</button><button class="tab-btn" data-tab="risks">Risques</button><button class="tab-btn" data-tab="sources">Sources</button></nav>
<section class="tab-content active" id="exec"><div class="stitle">Résumé de l’analyse</div><div class="narrative {{decisionClass}}">{{summary}}</div>{{#negotiationAvailable}}<div class="stitle">Position du prix demandé sur l’échelle de valeur — en euros</div><div class="price-position"><div class="price-position-title">Valeur, offre et coût total du projet</div>{{#scaleAvailable}}<div class="price-scale"><div class="price-scale-line"></div><div class="price-scale-range" style="{{prudentStyle}}"></div><div class="price-scale-range offer" style="{{offerStyle}}"></div><div class="price-scale-label prudent" style="{{prudentStyle}}"><strong>{{prudentRange}}</strong><div class="price-scale-caption">Valeur prudente estimée {{#prudentEstimate}}· hypothèse{{/prudentEstimate}}</div></div><div class="price-scale-label offer" style="{{offerStyle}}"><strong>{{offerRange}}</strong><div class="price-scale-caption">Fourchette d’offre recommandée</div></div><div class="price-scale-marker" style="{{askingStyle}}"><strong>{{askingPriceNegotiation}}</strong><div class="price-scale-caption">Prix demandé</div></div><div class="price-scale-marker total" style="{{totalStyle}}"><strong>{{totalCostNegotiation}}</strong><div class="price-scale-caption">Coût total frais et provision inclus</div></div></div>{{/scaleAvailable}}{{^scaleAvailable}}<div class="price-kpis"><div class="price-kpi"><div class="price-card-label">Valeur prudente</div><div class="price-kpi-value">{{prudentRange}}</div></div><div class="price-kpi"><div class="price-card-label">Offre recommandée</div><div class="price-kpi-value">{{offerRange}}</div></div><div class="price-kpi"><div class="price-card-label">Prix demandé</div><div class="price-kpi-value">{{askingPriceNegotiation}}</div></div><div class="price-kpi"><div class="price-card-label">Coût total</div><div class="price-kpi-value">{{totalCostNegotiation}}</div></div></div>{{/scaleAvailable}}<div class="price-position-comment">{{negotiationArgument}}</div></div><div class="stitle">Cohérence du prix</div><div class="price-kpis"><div class="price-kpi"><div class="price-card-label">Prix demandé au m²</div><div class="price-kpi-value">{{askingPricePerSqm}}</div><div class="price-kpi-note">Prix demandé pour {{surfaceReference}}</div></div><div class="price-kpi"><div class="price-card-label">Écart vs maisons de la commune</div><div class="price-kpi-value alert-value">{{communeGap}}</div><div class="price-kpi-note">Référence {{communeReference}}</div></div><div class="price-kpi"><div class="price-card-label">Écart vs maisons du quartier</div><div class="price-kpi-value alert-value">{{neighborhoodGap}}</div><div class="price-kpi-note">Référence {{neighborhoodReference}}</div></div></div><table class="market-table"><thead><tr><th>Source</th><th>Type</th><th>€/m²</th><th>Fourchette</th><th>Date</th></tr></thead><tbody>{{#marketRows}}<tr class="{{#analyzed}}analyzed{{/analyzed}}"><td>{{source}}</td><td>{{propertyType}}</td><td>{{pricePerSqm}}</td><td>{{range}}{{#precision}}<span class="market-detail">{{precision}}</span>{{/precision}}</td><td>{{referenceDate}}</td></tr>{{/marketRows}}</tbody></table><div class="market-limits">{{marketLimits}}</div>{{/negotiationAvailable}}{{^negotiationAvailable}}<div class="stitle">Négociation et cohérence du prix</div><div class="data-unavailable">Données indisponibles pour cette analyse. Relancez l’analyse patrimoniale pour générer l’échelle de valeur et les références de marché.</div>{{/negotiationAvailable}}<div class="stitle">Conditions de la décision</div><div class="conditions">{{#conditions}}<div class="cond-item"><span class="cond-num">{{number}}</span><span>{{text}}</span></div>{{/conditions}}{{^conditions}}<div class="cond-item">Aucune condition renseignée.</div>{{/conditions}}</div><div class="stitle">Points clés</div><div class="axes-grid"><div class="axe-card"><div class="upside-title">Point fort</div><div class="upside-desc">{{strength}}</div></div><div class="axe-card"><div class="upside-title">Point de vigilance</div><div class="upside-desc">{{watchout}}</div></div></div></section>
<section class="tab-content" id="train"><div class="stitle">Itinéraire ferroviaire recommandé</div><div class="narrative go"><strong>{{departureStation}} → {{arrivalStation}}</strong> · {{trainTypes}} · {{directLabel}}<br>Train : {{trainMinimum}} minimum, {{trainTypical}} typique · Porte-à-porte : {{totalMinimum}} minimum, {{totalTypical}} typique · Robustesse {{robustness}}</div><div class="hypo">Période observée : {{observationPeriod}} · Jours : {{observedDays}} · Fiabilité : {{reliability}}</div><div class="axes-grid"><div class="axe-card"><div class="axe-name">Jour ouvré</div><div class="axe-score">{{weekdayFrequency}}</div><div class="axe-comment">liaisons exploitables</div></div><div class="axe-card"><div class="axe-name">Samedi</div><div class="axe-score">{{saturdayFrequency}}</div><div class="axe-comment">liaisons exploitables</div></div><div class="axe-card"><div class="axe-name">Dimanche</div><div class="axe-score">{{sundayFrequency}}</div><div class="axe-comment">liaisons exploitables</div></div><div class="axe-card"><div class="axe-name">Accessibilité</div><div class="axe-score">{{accessScore}}/100</div><div class="axe-comment">{{accessVerdict}}</div></div></div><div class="stitle">Commentaire du trajet</div><div class="narrative">{{travelComment}}</div><p>{{frequencyComment}}</p><div class="axes-grid"><div class="axe-card"><div class="upside-title">Point fort</div><div class="upside-desc">{{accessStrength}}</div></div><div class="axe-card"><div class="upside-title">Point de vigilance</div><div class="upside-desc">{{accessWatchout}}</div></div></div><div class="stitle">Détail du score</div><div class="axes-grid">{{#criteria}}<div class="axe-card"><div class="axe-name">{{name}}</div><div class="axe-score">{{score}}</div><div class="axe-comment">{{justification}}</div></div>{{/criteria}}</div><div class="stitle">Dernier kilomètre</div><div class="hypo"><span>{{lastMileMode}}</span> · {{lastMileDistance}} · {{lastMileDuration}} · Voiture indispensable : {{carRequired}}</div><p>{{publicTransport}}</p><div class="stitle">Usages week-end</div><p><strong>Vendredi soir :</strong> {{fridayComment}}</p><p><strong>Dimanche soir retour :</strong> {{sundayComment}}</p><p><strong>Aller-retour journée :</strong> {{roundTrip}} · Temps sur place : {{onSiteTime}} — {{roundTripComment}}</p><div class="stitle">Alternatives</div>{{#alternatives}}<div class="upside-card"><div><div class="upside-title">{{station}} · {{directLabel}}</div><div class="upside-desc">{{comment}}</div></div><div class="upside-val-num">{{duration}}</div></div>{{/alternatives}}{{^alternatives}}<p>Aucun itinéraire alternatif pertinent.</p>{{/alternatives}}</section>
<section class="tab-content" id="quality"><div class="stitle">Stratégie patrimoniale</div><div class="narrative"><strong>Levier retenu : {{retainedLever}}</strong> · Usage : {{heritageUse}}<br>{{retainedLeverJustification}}</div><p>{{heritageComment}}</p><div class="stitle">Qualité patrimoniale</div><div class="axes-grid">{{#quality}}<div class="axe-card"><div class="axe-name">{{label}}</div><div class="axe-comment">{{value}}</div></div>{{/quality}}</div><div class="stitle">Grille de notation pondérée — {{score}}/100</div>{{#scoringAxes}}<div class="detail-block"><div class="detail-hdr"><div class="detail-hdr-name">{{name}} · Poids {{weight}} %</div><div class="detail-hdr-score {{scoreClass}}">{{score}}/100 · {{contribution}} pts</div></div><div class="krow"><span class="klbl">Confiance</span><span class="kval">{{confidence}}</span><span class="kcomment">{{justification}}</span></div><ul class="list">{{#arguments}}<li>{{.}}</li>{{/arguments}}</ul></div>{{/scoringAxes}}</section>
<section class="tab-content" id="levers"><div class="stitle">Leviers d’optimisation étudiés</div>{{#levers}}<div class="detail-block"><div class="detail-hdr"><div class="detail-hdr-name">{{name}}</div><div>{{applicable}} · {{feasibility}}</div></div><div class="krow"><span class="klbl">Résultat central</span><span class="kval">{{central}}</span><span class="ksrc">Dégradé : {{degraded}}</span><span class="kcomment">Travaux : {{works}} · Délai : {{delay}} · {{conditions}}</span></div>{{#sources}}<div class="market-detail">Source : {{#url}}<a href="{{url}}" target="_blank" rel="noopener noreferrer">{{label}}</a>{{/url}}{{^url}}{{label}}{{/url}} · {{date}}</div>{{/sources}}</div>{{/levers}}</section>
<section class="tab-content" id="finance"><div class="stitle">Ventilation du coût d’acquisition</div><div class="price-kpis"><div class="price-kpi"><div class="price-card-label">Prix affiché</div><div class="price-kpi-value">{{askingPrice}}</div></div><div class="price-kpi"><div class="price-card-label">Travaux immédiats</div><div class="price-kpi-value">{{immediateWorks}}</div></div><div class="price-kpi"><div class="price-card-label">Travaux patrimoniaux</div><div class="price-kpi-value">{{heritageWorks}}</div></div><div class="price-kpi"><div class="price-card-label">Frais annexes</div><div class="price-kpi-value">{{annexFees}}</div></div></div><div class="stitle">Coût d’acquisition modifiable</div><div class="finance-inputs" data-finance-editor data-price="{{askingPriceRaw}}" data-annex="{{annexFeesRaw}}"><label class="finance-input">Frais de notaire (€)<input type="number" min="0" step="100" value="{{notaryFeesRaw}}" data-finance-input="notary"></label><label class="finance-input">Travaux totaux (€)<input type="number" min="0" step="100" value="{{worksRaw}}" data-finance-input="works"></label><div class="finance-input"><span>Coût total recalculé</span><strong data-finance-total>{{totalCost}}</strong></div></div><p class="hypo">{{financeJustification}}</p><div class="stitle">Scénarios financiers</div><div class="scenarios">{{#scenarios}}<div class="scen-card"><div class="scen-hdr">{{name}} · Applicable : {{applicable}}</div><div class="scen-row"><span>Apport</span><strong>{{deposit}}</strong></div><div class="scen-row"><span>Capital emprunté</span><strong>{{loan}}</strong></div><div class="scen-row"><span>Taux · durée</span><strong>{{rate}} · {{term}}</strong></div><div class="scen-row"><span>Mensualité</span><strong>{{payment}}</strong></div><div class="scen-row"><span>Revenus d’optimisation/an</span><strong>{{optimizationIncome}}</strong></div><div class="scen-row"><span>Produit de revente net</span><strong>{{resale}}</strong></div><div class="scen-row"><span>Effort mensuel</span><strong>{{effort}}</strong></div><div class="scen-row"><span>Rendement net sur capital</span><strong>{{returnOnCapital}}</strong></div><div class="scen-row"><span>Condition d’activation</span><strong>{{activationCondition}}</strong></div><div class="scen-foot"><span>Coût net optimisé</span><strong>{{netCost}}</strong></div></div>{{/scenarios}}</div></section>
<section class="tab-content" id="risks"><div class="stitle">Risques classés par criticité</div><div class="risques"><div class="risq-hdr"><div class="rhc">Criticité</div><div class="rhc">Risque</div><div class="rhc">Action requise</div><div class="rhc">Impact</div></div>{{#risks}}<div class="risq-row"><div class="rcrit"><span class="rbadge {{criticalityClass}}">{{criticality}}</span></div><div class="rbody"><div class="rtitle">{{titre}}</div></div><div class="raction">{{action}}</div><div class="rmarge {{impactClass}}">{{impact}}</div></div>{{/risks}}</div><div class="stitle">Avant offre</div><ul class="list">{{#beforeOffer}}<li>{{.}}</li>{{/beforeOffer}}</ul><div class="stitle">Avant compromis</div><ul class="list">{{#beforeContract}}<li>{{.}}</li>{{/beforeContract}}</ul></section>
<section class="tab-content" id="sources"><div class="stitle">Sources générales</div><div class="sources-grid">{{#sources}}<div class="src-item">{{#url}}<a href="{{url}}" target="_blank" rel="noopener noreferrer">{{label}}</a>{{/url}}{{^url}}{{label}}{{/url}} · {{date}}</div>{{/sources}}</div><div class="stitle">Sources accessibilité</div><div class="sources-grid">{{#accessSources}}<div class="src-item">{{#url}}<a href="{{url}}" target="_blank" rel="noopener noreferrer">{{label}}</a>{{/url}}{{^url}}{{label}}{{/url}} · {{date}}</div>{{/accessSources}}</div><div class="stitle">Avertissements généraux</div><ul class="list">{{#warnings}}<li>{{.}}</li>{{/warnings}}{{^warnings}}<li>Aucun avertissement.</li>{{/warnings}}</ul><div class="stitle">Avertissements accessibilité</div><ul class="list">{{#accessWarnings}}<li>{{.}}</li>{{/accessWarnings}}{{^accessWarnings}}<li>Aucun avertissement.</li>{{/accessWarnings}}</ul><p class="hypo">Analyse indicative, avant fiscalité personnelle. Les horaires ferroviaires sont susceptibles d’évoluer.</p></section>
<footer class="site-footer"><span>Patrimonial optimisé · Prompt v{{promptVersion}}</span><span>{{city}} · {{analysisDate}}</span><span>{{decision}} · {{score}}/100</span></footer>
</script>
<script src="../assets/js/fiche.js" data-analysis-type="patrimonial"></script>
</body>
</html>
