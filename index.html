<!DOCTYPE html>
<html lang="fr" data-ui="app">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ImmoAggregator — Ma galerie</title>

  <!-- Leaflet pour la carte -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>

  <!-- Polices — identiques aux guides opérationnels (design system unifié) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">


  <link rel="stylesheet" href="assets/css/design-system.css">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<!-- ── Header ──────────────────────────────────────────────── -->
<header class="header">
<button class="btn-filters-mobile" id="btn-filters-mobile">☰ </button>
  <button class="header-logo" id="header-logo" type="button" title="Afficher la galerie" aria-label="Afficher la galerie">Immo<span>Agg</span></button>
  <div class="header-stats">
    <span>⭐ <b id="hdr-fav">—</b> favoris</span>
  </div>
  <div class="spacer"></div>

  <div class="view-switcher" id="view-switcher">
    <button class="view-btn active" data-view="gallery" title="Galerie">⊞</button>
    <button class="view-btn" data-view="list" title="Liste">≡</button>
    <button class="view-btn" data-view="map" title="Carte">🌐</button>
  </div>

</header>

<!-- ── Layout ─────────────────────────────────────────────── -->
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar" aria-label="Navigation et filtres" data-app-sidebar></aside>

  <!-- Main -->
  <main class="main">
    <div class="result-bar">
      <span><b id="result-count">—</b> annonces</span>
    </div>

    <!-- Galerie -->
    <div id="view-gallery" class="active">
      <div class="gallery-grid" id="gallery-grid">
        <div class="loading"><div class="spinner"></div><span>Chargement…</span></div>
      </div>
    </div>

    <!-- Liste -->
    <div id="view-list">
      <table class="list-table">
        <thead>
          <tr>
            <th></th>
            <th>Titre</th>
            <th class="sortable">Prix ↕</th>
            <th class="sortable">Surface ↕</th>
            <th>Ville</th>
            <th>Source</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="list-tbody"></tbody>
      </table>
    </div>

    <!-- Carte -->
    <div id="view-map">
      <div id="map"></div>
    </div>

    <!-- Guides et fiches, conservés dans le cadre de l'application -->
    <div id="view-in-app"><div id="in-app-content" aria-live="polite"></div></div>

    <div id="view-viewer">
<!-- ── Visionneuse d'annonce ──────────────────────────────── -->
<div class="viewer" id="viewer">
  <div class="viewer-top-actions">
    <div class="viewer-listing-nav" id="viewer-listing-nav" aria-label="Navigation entre les annonces">
      <button class="viewer-listing-nav-btn" id="viewer-listing-prev" aria-label="Annonce précédente">‹</button>
      <span class="viewer-listing-counter" id="viewer-listing-counter">1 / 1</span>
      <button class="viewer-listing-nav-btn" id="viewer-listing-next" aria-label="Annonce suivante">›</button>
    </div>
    <button class="viewer-close" id="viewer-close" aria-label="Fermer">✕</button>
  </div>
  <div class="viewer-content">

    <!-- Carrousel photos de l'annonce en cours -->
    <div class="viewer-media" id="viewer-media">
      <button class="viewer-nav viewer-nav-prev" id="viewer-photo-prev" aria-label="Photo précédente">‹</button>
      <img class="viewer-img" id="viewer-img" src="" alt="">
      <div class="viewer-placeholder" id="viewer-placeholder" hidden>🏠</div>
      <button class="viewer-nav viewer-nav-next" id="viewer-photo-next" aria-label="Photo suivante">›</button>
      <div class="viewer-photo-counter" id="viewer-photo-counter" hidden>1 / 1</div>
      <div class="viewer-thumbs" id="viewer-thumbs" hidden></div>
    </div>

    <!-- Informations complètes de l'annonce -->
    <div class="viewer-panel">
      <div class="viewer-panel-scroll">
        <div class="viewer-eyebrow" id="viewer-eyebrow">Annonce sauvegardée</div>
        <div class="viewer-tags" id="viewer-tags"></div>
        <h2 class="viewer-title" id="viewer-title">—</h2>

        <div class="viewer-price-row">
          <span class="viewer-price" id="viewer-price">—</span>
          <span class="viewer-price-reduction" id="viewer-price-reduction" hidden></span>
        </div>
        <div class="viewer-location" id="viewer-location">—</div>

        <div class="viewer-stats" id="viewer-stats"></div>

        <div class="viewer-section" id="viewer-desc-section" hidden>
          <h3>Description</h3>
          <p id="viewer-description"></p>
        </div>

        <div class="viewer-section" id="viewer-features-section" hidden>
          <h3>Caractéristiques</h3>
          <div class="viewer-features" id="viewer-features"></div>
        </div>

        <div class="viewer-section" id="viewer-meta-section">
          <h3>Informations</h3>
          <div class="viewer-meta" id="viewer-meta"></div>
        </div>
      </div>

      <div class="viewer-actions">
        <div class="viewer-selection-btns" id="viewer-selection-btns"></div>
        <div class="viewer-cta-row">
          <button class="viewer-btn viewer-btn-icon viewer-btn-map" id="viewer-map-btn" title="Voir sur la carte" aria-label="Voir sur la carte">🗺</button>
          <button class="viewer-btn viewer-btn-icon viewer-btn-delete" id="viewer-delete-btn" title="Supprimer" aria-label="Supprimer">🗑</button>
          <a class="viewer-btn viewer-btn-fiche" id="viewer-fiche-link" href="#" hidden>📄 Fiche In App</a>
          <a class="viewer-btn viewer-btn-primary" id="viewer-link" href="#" target="_blank" rel="noopener">Voir l'annonce →</a>
        </div>
      </div>
    </div>
  </div>
</div>

    </div>
  </main>
</div>

<!-- Modale suppression -->
<div class="delete-modal" id="delete-modal">
  <div class="delete-modal-box">
    <h3>🗑 Supprimer l'annonce</h3>
    <p>Voulez-vous supprimer <span class="delete-modal-name" id="delete-modal-title"></span> de votre galerie ?<br>Cette action est irréversible.</p>
    <div class="delete-modal-actions">
      <button class="btn-modal-cancel" id="delete-modal-cancel">Annuler</button>
      <button class="btn-modal-confirm" id="delete-modal-confirm">Supprimer</button>
    </div>
  </div>
</div>


<!-- La version évite de combiner ce HTML, dont les choix sont dynamiques, avec un ancien app.js en cache. -->
<script src="assets/js/app-sidebar.js?v=20260728-property-shell"></script>
<script src="assets/js/app.js?v=20260728-relative-property-url"></script>
<script src="assets/js/navigation.js"></script>
</body>
</html>
